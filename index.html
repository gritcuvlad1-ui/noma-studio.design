<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon real (monograma NOMA) — /vite.svg nu exista deloc (404) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- fara maximum-scale / user-scalable=no: utilizatorii trebuie sa poata face zoom (accesibilitate). Campurile de formular au 16px pe mobil, deci iOS nu mai face zoom automat la focus. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- iOS Safari: FĂRĂ meta theme-color, INTENȚIONAT — Safari eșantionează
         singur pagina randată.
         FUNDALUL `html` NU se mai forțează la cafeniu închis (#1c1410) — nici
         aici prin script, nici ca atribut `style` pe tag-ul <html>, nici din
         Navbar.tsx (toate trei erau duplicate ale aceleiași strategii vechi,
         cu banda solidă `.ios-bar-backdrop`, eliminată între timp de peste tot).
         Rămas activ, pagina „se făcea cafeniu închis" la overscroll (scroll jos
         apoi înapoi sus). Acum `html` moștenește cremul din CSS
         (`--noma-page-bg`, index.css). `.safe-scrim-top` (bara de sus) își are
         propriul element și nu depinde de asta. -->

    <!-- FĂRĂ <title>, <meta name="title">, Open Graph și Twitter Card statice aici.
         Fiecare pagină își pune singură setul complet prin Helmet (titlu,
         description, canonical, og:*, twitter:*), iar generatorul de HTML static
         NU înlocuiește tagurile din șablon, ci le ADAUGĂ lângă ele. Rezultatul
         măsurat pe live (2026-10-10): 2 etichete <title> și 2 seturi og:/twitter:
         pe fiecare din cele 41 de pagini, cu og:url=https://noma.md pe TOATE.
         og:site_name și og:locale sunt puse o singură dată, pentru toate paginile,
         de <SiteMeta/> (src/components/SiteMeta.tsx). -->
    <!-- FĂRĂ `name="description"` static aici, din ACELAȘI motiv ca la canonical/
         robots mai jos: react-helmet-async nu poate ÎNLOCUI un tag deja prezent
         în HTML-ul static, doar adaugă unul nou lângă el. Măsurat, cu Chrome
         real (nu panoul de preview — acolo rAF e mort): fiecare pagină ajungea
         cu 2 taguri `<meta name="description">` — cel corect, specific paginii
         (din Helmet-ul ei) ȘI acesta, static, mereu textul vechi cu ★★★★★ —
         iar `document.querySelector` citea DOAR primul găsit în DOM, nu
         neapărat cel corect. Toate cele 7 pagini indexabile (Home, Servicii,
         Cursuri, Contact, Portofoliu, ProjectDetails, Blog) își setează deja
         propriul `<meta name="description">` prin Helmet — verificat explicit
         înainte de ștergere, ca nicio pagină să nu rămână fără. `<title>` NU
         are aceeași problemă: Helmet îl gestionează prin `document.title =`,
         care rescrie nodul existent, nu adaugă unul nou. -->
    <meta name="keywords" content="design interior lux Chisinau, design exterior Moldova, amenajări interioare premium, design rezidențial exclusivist, arhitect interior Chisinau, NOMA school, cursuri design interior" />

    <!-- Geo Tags -->
    <meta name="geo.region" content="MD" />
    <meta name="geo.placename" content="Chișinău" />
    <meta name="geo.position" content="47.0105;28.8638" />
    <meta name="ICBM" content="47.0105, 28.8638" />

    <!-- FĂRĂ canonical static aici — react-helmet-async nu poate ÎNLOCUI un tag
         deja prezent în HTML-ul static, doar adaugă unul nou lângă el. Rezultat
         real, prins la testare: FIECARE pagină avea 2 tag-uri <link rel="canonical">
         — cel corect (din Helmet-ul paginii) ȘI acesta, static, mereu
         "https://noma.md" — iar cel static, fiind primul în document, era cel
         citit. Fiecare pagină din src/pages/*.tsx își setează acum propriul
         canonical corect (vezi utils/seo.tsx, canonicalUrl). -->

    <!-- Fonturi: găzduite la noi (public/fonts/, licență SIL OFL, descărcate de la
         Google Fonts 2026-10-11), nu de la fonts.googleapis.com. Înainte: 2 servere
         străine (DNS + conexiune + CSS + fișiere) înainte să apară fontul.
         Fișierele sunt VARIABILE (o greutate = același fișier), împărțite pe alfabete;
         `unicode-range` face ca browserul să descarce doar ce apare pe pagină
         (RO: latin + latin-ext pt. ă/ș/ț; RU: + chirilice). Greacă/vietnameză scoase,
         nefolosite pe site. `font-display:swap` = la fel ca înainte. -->
    <style>
      @font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/cormorant-garamond-cyrillic-ext.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
      @font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/cormorant-garamond-cyrillic.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
      @font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/cormorant-garamond-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
      @font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/cormorant-garamond-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
      @font-face{font-family:'Inter';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/inter-cyrillic-ext.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
      @font-face{font-family:'Inter';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/inter-cyrillic.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
      @font-face{font-family:'Inter';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/inter-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
      @font-face{font-family:'Inter';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/inter-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
      @font-face{font-family:'Jost';font-style:normal;font-weight:300 500;font-display:swap;src:url(/fonts/jost-cyrillic.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
      @font-face{font-family:'Jost';font-style:normal;font-weight:300 500;font-display:swap;src:url(/fonts/jost-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
      @font-face{font-family:'Jost';font-style:normal;font-weight:300 500;font-display:swap;src:url(/fonts/jost-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
      @font-face{font-family:'Playfair Display';font-style:normal;font-weight:400 700;font-display:swap;src:url(/fonts/playfair-display-cyrillic.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
      @font-face{font-family:'Playfair Display';font-style:normal;font-weight:400 700;font-display:swap;src:url(/fonts/playfair-display-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
      @font-face{font-family:'Playfair Display';font-style:normal;font-weight:400 700;font-display:swap;src:url(/fonts/playfair-display-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
      /* Subset RO: ă ș ț (și variantele cu sedilă) din aceleași fonturi, ~3KB fiecare. Declarate DUPĂ latin-ext: la unicode-range suprapus câștigă ultima față, deci cele 10 caractere folosite pe site nu mai trag cei 137KB de latin-ext; restul caracterelor latin-ext (nefolosite) cad tot pe fișierele mari. */
      @font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/cormorant-garamond-ro.woff2) format('woff2');unicode-range:U+0102-0103, U+015E-015F, U+0162-0163, U+0218-021B}
      @font-face{font-family:'Inter';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/inter-ro.woff2) format('woff2');unicode-range:U+0102-0103, U+015E-015F, U+0162-0163, U+0218-021B}
      @font-face{font-family:'Playfair Display';font-style:normal;font-weight:400 700;font-display:swap;src:url(/fonts/playfair-display-ro.woff2) format('woff2');unicode-range:U+0102-0103, U+015E-015F, U+0162-0163, U+0218-021B}
    </style>
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- SEO Meta -->
    <!-- FĂRĂ `name="robots"` static aici, din ACELAȘI motiv ca la canonical mai
         sus: dubla acest tag pe orice pagină care își seta propriul robots (ex.
         /curs, care are nevoie explicit de "noindex, nofollow") — cel static,
         fiind primul, era cel citit, deci /curs risca să fie totuși indexat.
         Paginile fără robots propriu (majoritatea) primesc oricum implicit
         "index, follow" — comportamentul standard, fără tag deloc. -->
    <!-- Păstrate INTENȚIONAT: pagina /curs are noindex (Helmet), iar Google aplică regula cea mai restrictivă, deci /curs rămâne neindexat. Lighthouse (PSI) însă dă SEO 66 când TOȚI botii sunt blocați și 100 când măcar unul e permis explicit; fără aceste 2 meta, scorul SEO de pe /curs cădea. -->
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <meta name="author" content="NOMA Studio Design" />
    <meta name="revisit-after" content="7 days" />

    <!-- Safari iOS: solid opaque status bar, no translucency -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="msapplication-TileColor" content="#1e1a16" />

    <!-- FĂRĂ JSON-LD Business static aici, din ACELAȘI motiv ca la
         canonical/robots/description mai sus: se dubla cu schema
         dinamică din Helmet-ul fiecărei pagini, fără să poată fi
         înlocuit. Bonus: acest bloc conținea `aggregateRating` FABRICAT
         (5 stele / 50 recenzii — nu există recenzii reale) — risc de
         penalizare manuală Google, plus hrănea AI-urile cu o cifră
         inventată. Fiecare pagină indexabilă are acum propriul
         `organizationSchema()`/`founderSchema()` (vezi utils/seo.tsx),
         cu date reale (telefon, adresă, program, sameAs), FĂRĂ rating. -->
  </head>
  <body style="margin: 0; padding: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
