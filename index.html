    <!-- iOS Safari: FĂRĂ meta theme-color, INTENȚIONAT — Safari eșantionează
         singur pagina randată. Ambele bare (status sus, URL jos) primesc benzi
         SOLIDE cafeniu închis #1c1410 (nuanța meniului hamburger) pictate în
         pagină (.safe-scrim-top / .ios-bar-backdrop) → prin bare nu se văd
         niciodată elementele. html bg identic = overscroll continuu cu barele. -->
    <script>
      document.documentElement.style.backgroundColor = '#1c1410';
    </script>
