<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon real (monograma NOMA) — /vite.svg nu exista deloc (404) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- iOS Safari: FĂRĂ meta theme-color, INTENȚIONAT — Safari eșantionează
         singur pagina randată.
         FUNDALUL `html` NU se mai forțează la cafeniu închis (#1c1410) — nici
         aici prin script, nici ca atribut `style` pe tag-ul <html>, nici din
         Navbar.tsx (toate trei erau duplicate ale aceleiași strategii vechi,
         cu banda solidă `.ios-bar-backdrop`, eliminată între timp de peste tot).
         Rămas activ, pagina „se făcea cafeniu închis" la overscroll (scroll jos
         apoi înapoi sus). Acum `html` moștenește cremul din CSS
         (`--noma-page-bg`, index.css). `.safe-scrim-top` (bara de sus) își are
         propriul element și nu depinde de asta. -->

    <!-- Primary Meta Tags -->
    <title>NOMA Studio Design | Design Interior și Exterior de Lux în Moldova 2026</title>
    <meta name="title" content="NOMA Studio Design | Design Interior și Exterior de Lux în Moldova 2026" />
    <meta name="description" content="★★★★★ Studio de design interior și exterior premium în Chișinău, Moldova. Transformăm spațiile în experiențe unice prin proiecte rezidențiale și comerciale exclusiviste." />
    <meta name="keywords" content="design interior lux Chisinau, design exterior Moldova, amenajări interioare premium, design rezidențial exclusivist, arhitect interior Chisinau, NOMA school, cursuri design interior" />

    <!-- Geo Tags -->
    <meta name="geo.region" content="MD" />
    <meta name="geo.placename" content="Chișinău" />
    <meta name="geo.position" content="47.0105;28.8638" />
    <meta name="ICBM" content="47.0105, 28.8638" />

    <!-- FĂRĂ canonical static aici — react-helmet-async nu poate ÎNLOCUI un tag
         deja prezent în HTML-ul static, doar adaugă unul nou lângă el. Rezultat
         real, prins la testare: FIECARE pagină avea 2 tag-uri <link rel="canonical">
         — cel corect (din Helmet-ul paginii) ȘI acesta, static, mereu
         "https://noma.md" — iar cel static, fiind primul în document, era cel
         citit. Fiecare pagină din src/pages/*.tsx își setează acum propriul
         canonical corect (vezi utils/seo.tsx, canonicalUrl). -->

    <!-- Font Preconnect + Preload optimizat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Inter:wght@300;400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" />
    </noscript>
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://noma.md" />
    <meta property="og:site_name" content="NOMA Studio Design" />
    <meta property="og:title" content="NOMA Studio Design | Design Interior și Exterior de Lux în Moldova" />
    <meta property="og:description" content="Studio de design interior și exterior premium în Chișinău. Proiecte complete și randări 3D fotorealiste." />
    <!-- /hero-villa.png nu exista (404 → share fără poză) — og-image.jpg e
         generată real, 1200×630, dintr-o randare de portofoliu -->
    <meta property="og:image" content="https://noma.md/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NOMA Studio Design - Proiecte Design Interior Lux" />
    <meta property="og:locale" content="ro_MD" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://noma.md" />
    <meta name="twitter:title" content="NOMA Studio Design | Design Interior și Exterior de Lux" />
    <meta name="twitter:description" content="Studio de design interior și exterior premium în Chișinău. Amenajări interioare de lux." />
    <meta name="twitter:image" content="https://noma.md/og-image.jpg" />

    <!-- SEO Meta -->
    <!-- FĂRĂ `name="robots"` static aici, din ACELAȘI motiv ca la canonical mai
         sus: dubla acest tag pe orice pagină care își seta propriul robots (ex.
         /curs, care are nevoie explicit de "noindex, nofollow") — cel static,
         fiind primul, era cel citit, deci /curs risca să fie totuși indexat.
         Paginile fără robots propriu (majoritatea) primesc oricum implicit
         "index, follow" — comportamentul standard, fără tag deloc. -->
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <meta name="author" content="NOMA Studio Design" />
    <meta name="revisit-after" content="7 days" />

    <!-- Safari iOS: solid opaque status bar, no translucency -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="msapplication-TileColor" content="#1e1a16" />

    <!-- Schema.org Business JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "NOMA Studio Design",
      "description": "Studio de design interior și exterior de lux în Chișinău, Moldova",
      "url": "https://noma.md",
      "logo": "https://noma.md/apple-touch-icon.png",
      "image": "https://noma.md/og-image.jpg",
      "priceRange": "€€€",
      "telephone": "+37362167165",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "MD",
        "addressLocality": "Chișinău",
        "addressRegion": "Chișinău"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "47.0105",
        "longitude": "28.8638"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5",
        "reviewCount": "50"
      },
      "areaServed": [
        { "@type": "City", "name": "Chișinău" },
        { "@type": "City", "name": "Bălți" },
        { "@type": "City", "name": "Ialoveni" }
      ]
    }
    </script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous"
      />
    </noscript>
  </head>
  <body style="margin: 0; padding: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
